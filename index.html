<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1255">
  <title>kunjolu</title>
  <meta name="description" content="A romantic celebration of one month together — APK & Adeeba">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./photos/logo.png" type="image/png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="preload" href="https://unpkg.com/react@18/umd/react.production.min.js" as="script" crossorigin>
  <link rel="preload" href="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" as="script" crossorigin>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a0a0f">
</head>
<body>
  <!-- Orientation Warning Overlay -->
  <div id="landscape-warning">
    <div class="landscape-content">
      <div class="rotate-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FF8FA3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2.5" ry="2.5"/>
          <path d="M12 18h.01"/>
        </svg>
      </div>
      <h2>Rotate Device</h2>
      <p>Please rotate your phone sideways for the best experience.</p>
    </div>
  </div>
  
  <div id="root"></div>
  <canvas id="confetti"></canvas>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="./app.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('ServiceWorker registered:', reg.scope);
        }).catch(err => {
          console.log('ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
